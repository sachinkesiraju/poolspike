<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 628" width="760" height="628" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Poolspike judge architecture"><rect width="760" height="628" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker></defs><text x="24" y="30" text-anchor="start" font-size="15" font-weight="600" fill="#1f2328">The judge is a 2,354-parameter network over the balls and the table</text><text x="24" y="50" text-anchor="start" font-size="11.5" fill="#57606a">VNet2: one forward pass per simulated outcome, plain NumPy</text><g fill="none" stroke="#8a8f98" stroke-width="1.25"><path d="M200 124V168" marker-end="url(#a)"/><path d="M200 224V246H88V268" marker-end="url(#a)"/><path d="M200 224V268" marker-end="url(#a)"/><path d="M200 224V246H312V268" marker-end="url(#a)"/><path d="M88 324V368" marker-end="url(#a)"/><path d="M200 324V368" marker-end="url(#a)"/><path d="M312 324V368" marker-end="url(#a)"/><path d="M560 124V368" marker-end="url(#a)"/><path d="M380 424V458" marker-end="url(#a)"/><path d="M380 514V548" marker-end="url(#a)"/></g><path d="M690 96H736V576H641" fill="none" stroke="#2f6fde" stroke-width="1.5" stroke-dasharray="5 4"/><text x="728" y="510" text-anchor="end" font-size="11.5" fill="#57606a">analytic logit × 0.28</text><text x="728" y="526" text-anchor="end" font-size="11.5" fill="#57606a">skips to the output</text><rect x="70.0" y="68" width="260" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="200" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Each of 15 balls: 12 features</text><text x="200" y="111" text-anchor="middle" font-size="11.5" fill="#57606a">position, pot odds, open lanes, rails</text><rect x="430.0" y="68" width="260" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="560" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Table: 17 numbers</text><text x="560" y="111" text-anchor="middle" font-size="11.5" fill="#57606a">standardized, incl. analytic value</text><rect x="70.0" y="168" width="260" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="200" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Shared ball encoder</text><text x="200" y="211" text-anchor="middle" font-size="11.5" fill="#57606a">12 → 16, tanh, same weights per ball</text><rect x="40.0" y="268" width="96" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="88" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Mine</text><text x="88" y="311" text-anchor="middle" font-size="11.5" fill="#57606a">sum / 8</text><rect x="152.0" y="268" width="96" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="200" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Theirs</text><text x="200" y="311" text-anchor="middle" font-size="11.5" fill="#57606a">sum / 8</text><rect x="264.0" y="268" width="96" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="312" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">8-ball</text><text x="312" y="311" text-anchor="middle" font-size="11.5" fill="#57606a">sum / 8</text><rect x="40.0" y="368" width="680" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="380" y="392" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Join: 3 pools × 16 + 17 table numbers = 65 inputs</text><text x="380" y="411" text-anchor="middle" font-size="11.5" fill="#57606a">order of the balls does not matter</text><rect x="180.0" y="458" width="400" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"/><text x="380" y="482" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Hidden layer: 32 tanh units</text><text x="380" y="501" text-anchor="middle" font-size="11.5" fill="#57606a">65 × 32 weights</text><rect x="120.0" y="548" width="520" height="56" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2"/><text x="380" y="572" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Win probability for the player to move</text><text x="380" y="591" text-anchor="middle" font-size="11.5" fill="#1f2328">sigmoid(units + 0.28 × analytic logit + 0.59)</text></svg>
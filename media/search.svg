<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 598" width="760" height="598" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Poolspike decision pipeline"><rect width="760" height="598" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker></defs><text x="24" y="30" text-anchor="start" font-size="15" font-weight="600" fill="#1f2328">How Poolspike picks a shot</text><text x="24" y="50" text-anchor="start" font-size="11.5" fill="#57606a">Every simulated outcome is scored by the learned judge (VNet2). Blue: the finalist search; each shot takes one branch.</text><rect x="120.0" y="72" width="520" height="72" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="380" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Candidates</text><text x="380" y="115" text-anchor="middle" font-size="11.5" fill="#57606a">5 aim lanes × 14 strokes per pot, plus banks, kicks,</text><text x="380" y="132" text-anchor="middle" font-size="11.5" fill="#57606a">combinations and ball-in-hand placements</text><path d="M380 144V174" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#a)"/><rect x="120.0" y="174" width="520" height="55" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="380" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Sample: 4 noisy plays of every candidate</text><text x="380" y="217" text-anchor="middle" font-size="11.5" fill="#57606a">keep the best 6, play each 20 more times (24 in all)</text><path d="M380 229V259" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#a)"/><rect x="230.0" y="259" width="300" height="56" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="380" y="283" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">4 or fewer of our balls left?</text><text x="380" y="302" text-anchor="middle" font-size="11.5" fill="#57606a">the 8 counts as one</text><path d="M230 287H200V351" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#a)"/><path d="M530 287H560V351" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#a)"/><text x="208" y="281" text-anchor="start" font-size="11.5" fill="#57606a">no</text><text x="552" y="281" text-anchor="end" font-size="11.5" fill="#57606a">yes</text><rect x="35.0" y="351" width="330" height="106" rx="8" fill="none" stroke="#2f6fde" stroke-width="1.75"/><text x="200" y="375" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Refine the stroke of the best shot</text><text x="200" y="394" text-anchor="middle" font-size="11.5" fill="#57606a">6 variants: speed ±0.6 m/s, follow/draw ±0.3,</text><text x="200" y="411" text-anchor="middle" font-size="11.5" fill="#57606a">side ±0.25, each re-aimed; all on the same</text><text x="200" y="428" text-anchor="middle" font-size="11.5" fill="#57606a">24 noise draws; switch only if the paired</text><text x="200" y="445" text-anchor="middle" font-size="11.5" fill="#57606a">gain beats 2 standard errors</text><rect x="395.0" y="351" width="330" height="106" rx="8" fill="none" stroke="#2f6fde" stroke-width="1.75"/><text x="560" y="375" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Look two shots ahead</text><text x="560" y="394" text-anchor="middle" font-size="11.5" fill="#57606a">top 3 shots: refine each, then 32 noisy plays;</text><text x="560" y="411" text-anchor="middle" font-size="11.5" fill="#57606a">where our ball drops, score the table by our</text><text x="560" y="428" text-anchor="middle" font-size="11.5" fill="#57606a">best next pot (small search, then re-scored</text><text x="560" y="445" text-anchor="middle" font-size="11.5" fill="#57606a">on fresh draws so noise does not inflate it)</text><path d="M200 457V477H376V497" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#a)"/><path d="M560 457V477H384V497" fill="none" stroke="#8a8f98" stroke-width="1.25" marker-end="url(#a)"/><rect x="120.0" y="497" width="520" height="55" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/><text x="380" y="521" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Play the shot with the highest mean win chance</text><text x="380" y="540" text-anchor="middle" font-size="11.5" fill="#57606a">wins and losses by the rules; otherwise the judge's (or the lookahead's) win chance</text><text x="380" y="582" text-anchor="middle" font-size="11.5" fill="#57606a">About 13 CPU-seconds per shot on one core</text></svg>